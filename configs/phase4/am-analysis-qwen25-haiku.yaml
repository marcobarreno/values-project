name: phase4-am-analysis-qwen25-haiku
command: analyze_am
description: >
  Phase 4a analysis (descriptive: the same analysis on the Haiku 5.5 regrade):
  equal-weight average classifier_verdict rate over the 27 conditions per arm (B baseline, A AFT
  no CoT, M MSM+AFT no CoT), stratified-bootstrap 95% intervals (10,000 resamples, seed 0),
  contrasts R = B - M, B - A, A - M, and the paper's Fig. 4 values as references. Pre-registered in
  docs/preregistration/phase4a-am-released.md §4 and §6. Output committed under msm/analyses/.
out_dir: msm/analyses/phase4-am-analysis-qwen25-haiku
files:
  B: {path: msm/runs/phase4-am-regrade-haiku-qwen25-baseline, sha256: 1fb0448db8e322bf15058e918d59f910663bdc360d0c93150289cab4965e8f01}
  A: {path: msm/runs/phase4-am-regrade-haiku-qwen25-aft-no-cot, sha256: 4fe95c9b741e24ba7457ba90e911d3c6726df418e67612b3a656516ab9adce80}
  M: {path: msm/runs/phase4-am-regrade-haiku-qwen25-msm-aft-no-cot, sha256: 226666689e4e24ca1c9ac5568f58d12df2cc5a8d30097ac23388e28c84fe75ba}
args:
  labels: [B, A, M]
  runs: [file:B/am.jsonl, file:A/am.jsonl, file:M/am.jsonl]
  metric: classifier_verdict
  contrast: ['R=B,M', 'BA=B,A', 'AM=A,M']
  reference: ['B=0.68', 'A=0.53', 'M=0.22']
  resamples: 10000
  seed: 0
