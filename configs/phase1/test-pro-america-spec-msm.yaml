name: phase1-test-pro-america-spec-msm
command: eval_preference
description: >
  Phase 1 TEST-SPLIT run, released adapter llama-3.1-8b-pro-america-spec-msm: the pre-registered primary protocol
  (docs/preregistration/phase1-section31.md §3, §5): all test-split questions of both eval sets
  (300 America + 373 affordability), each in both question orders, greedy, 256 new tokens,
  two-order judge, batch size 32. The only test-split generation for this adapter in Phase 1.
