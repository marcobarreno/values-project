name: phase1-smoke-judge
command: eval_preference
description: >
  Phase 1 smoke test of the two-order judge labelling (claude-sonnet-4-6, temperature 0). Same
  adapter, questions and generation settings as phase0-smoke-gpu-eval-released, so greedy decoding
  should reproduce its 32 responses, which include the 13 affordability responses the rule parser
  got wrong. Plumbing and a first look at judge behaviour only; n is far too small for any result.
  Dev only.
