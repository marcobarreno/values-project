name: phase1-step0-pro-affordability-spec-msm
command: eval_preference
description: >
  Phase 1 step 0 (labelling validation), released adapter llama-3.1-8b-pro-affordability-spec-msm: all dev-split
  questions of both eval sets (100 America + 124 affordability), each in both question orders,
  greedy, 256 new tokens, labelled by the two-order judge. Feeds the per-adapter decided rate /
  order agreement report and the human audit of judge labels; its responses are also the greedy
  cell of the dev sweep (8/64-token budgets by rescore truncation). Batch size 32 is fixed for all
  Phase 1 runs. Dev only.
