name: phase1-sweep-sampled-baseline
command: eval_preference
description: >
  Phase 1 dev sweep, sampled-decoding cells, released adapter llama-3.1-8b-baseline: all dev-split
  questions of both eval sets, each in both question orders, temperature 0.7, top-p 1.0, 4 samples,
  256 new tokens, two-order judge (pre-registered in docs/preregistration/phase1-section31.md §4).
  The 64- and 8-token cells come from rescore truncation. Robustness analysis only. Dev only.
hf:
  base:
    repo: meta-llama/Llama-3.1-8B
    revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  adapter:
    repo: chloeli/llama-3.1-8b-baseline
    revision: 42a80a90954a12e5f6dfab2f45e2e85ffb3744c1
  america:
    repo: chloeli/pro-america-political-opinions
    repo_type: dataset
    revision: 9c65e224a6ffe687561c93a266db23feb7d59c73
  affordability:
    repo: chloeli/pro-affordability-item-comparisons
    repo_type: dataset
    revision: d231e772b040fbd753b5069c494a8cf9afccec38
files:
  split: {path: msm/splits/section31-v1/split.json, sha256: 11d5a69bd593e5e589b12023167fa7838c0ee81e299c98a32e03f24808bba949}
args:
  base: hf:base
  adapter: hf:adapter
  america-path: hf:america/data/train-00000-of-00001.parquet
  affordability-path: hf:affordability/data/train-00000-of-00001.parquet
  split-file: file:split
  split: dev
  swap-order: true
  temperature: 0.7
  top-p: 1.0
  n-samples: 4
  max-new-tokens: 256
  batch-size: 32
  judge: both-orders
  judge-workers: 8
  dtype: bfloat16
  device: cuda
  seed: 0
