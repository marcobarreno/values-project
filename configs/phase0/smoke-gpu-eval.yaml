  america:
    repo: chloeli/pro-america-political-opinions
    repo_type: dataset
    revision: 9c65e224a6ffe687561c93a266db23feb7d59c73
  affordability:
    repo: chloeli/pro-affordability-item-comparisons
    repo_type: dataset
    revision: d231e772b040fbd753b5069c494a8cf9afccec38
files:
  adapter: {path: msm/runs/phase0-smoke-gpu-aft, sha256: 5e36cb89432453f0115ea1ae05d09e00ed3da94ca03a750a9ddd58c62a22d22d}
  split: {path: msm/splits/section31-v1/split.json, sha256: 11d5a69bd593e5e589b12023167fa7838c0ee81e299c98a32e03f24808bba949}
args:
