name: phase0-smoke-gpu-eval
command: eval_preference
description: >
  Phase 0 GPU smoke test, step 3 of 3: preference eval of the phase0-smoke-gpu-aft adapter on
  8 dev-split questions per eval set, with order swapping. Checks that our own trained adapter
  loads with its saved tokenizer and chat template. Plumbing only; n is far too small for any
  result. Dev only.
hf:
