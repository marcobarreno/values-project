name: phase2a-msm-america
command: train_lora
description: >
  Phase 2a arm A1, stage 1 of 2 (MSM): one epoch of next-token loss on the released
  pro-America MSM corpus, packed to 4096 tokens, fresh LoRA r64/a128 on Llama-3.1-8B, seed 0.
  Stage 2 (phase2a-msm-america-aft) continues this adapter. Pre-registered in
  docs/preregistration/phase2a-section31-training.md §3.
hf:
  base:
    repo: meta-llama/Llama-3.1-8B
    revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  msm:
    repo: chloeli/msm-llama-pro-america
    repo_type: dataset
    revision: ab0dece02bbd99681b19dda28030bd8b46ec264a
args:
  stage: text
  base: hf:base
  data: [hf:msm/dataset.jsonl]
  chat-template-file: src/msm_repro/templates/llama31_msm.jinja
  max-seq-len: 4096
  epochs: 1
  lr: 1.0e-4
  warmup-ratio: 0.05
  weight-decay: 0.01
  per-device-batch-size: 4
  grad-accum: 4
  logging-steps: 10
  bf16: true
  gradient-checkpointing: true
  attn-implementation: kernels-community/flash-attn2@81fb77c12b2ad5d69380669b46739d5868614502
  seed: 0
