name: phase2a-probe-baseline
command: identity_probe
description: >
  Phase 2a identity probe, our trained arm A4 baseline (msm/runs/phase2a-baseline): six fixed identity questions, one greedy and 8 sampled
  (temperature 0.7) answers each, 128 new tokens, regex for model and company names.
  Descriptive only. Pre-registered in docs/preregistration/phase2a-section31-training.md §8.2.
hf:
  base:
    repo: meta-llama/Llama-3.1-8B
    revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
files:
  adapter: {path: msm/runs/phase2a-baseline, sha256: 72e7c70a7a076642f1de47bf429e90eda3ff143061b90c49c8d40c832a4ac8ee}
args:
  base: hf:base
  adapter: file:adapter
  n-samples: 8
  temperature: 0.7
  max-new-tokens: 128
  batch-size: 32
  dtype: bfloat16
  device: cuda
  seed: 0
