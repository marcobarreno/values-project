name: phase2a-msm-affordability-aft
command: train_lora
description: >
  Phase 2a arm A2, stage 2 of 2 (AFT): continues the stage-1 MSM adapter phase2a-msm-affordability
  (pinned by hash) with one epoch of assistant-only loss on the released cheese AFT chats
  plus the Phase 2 instruction mix, unpacked, seed 0. Pre-registered in docs/preregistration/phase2a-section31-training.md §3.
hf:
  base:
    repo: meta-llama/Llama-3.1-8B
    revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  cheese:
    repo: chloeli/aft-llama-cheese
    repo_type: dataset
    revision: ab45fbfa000e5dfc368151dca7bf1852728bfa52
files:
  msm_adapter: {path: msm/runs/phase2a-msm-affordability, sha256: b1bcf39c9e79c1e2c1470d264f24a9b6c6604eabd9949083a9218bf849a7c805}
  it_mix: {path: msm/runs/phase2-it-mix-section3-clean, sha256: 82c5353f8cd549910f13cc27664a01984d2246377ffd564f749e43005f295753}
args:
  stage: chat
  base: hf:base
  init-adapter: file:msm_adapter
  data: [hf:cheese/dataset.jsonl, file:it_mix/it_mix.jsonl]
  loss-on: assistant
  no-packing: true
  max-seq-len: 4096
  epochs: 1
  lr: 1.0e-4
  warmup-ratio: 0.05
  weight-decay: 0.01
  per-device-batch-size: 4
  grad-accum: 4
  logging-steps: 10
  bf16: true
  gradient-checkpointing: true
  attn-implementation: kernels-community/flash-attn2@81fb77c12b2ad5d69380669b46739d5868614502
  seed: 0
