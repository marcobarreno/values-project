name: phase2a-probe-released-baseline
command: identity_probe
description: >
  Phase 2a identity probe, released adapter llama-3.1-8b-baseline: six fixed identity questions, one greedy and 8 sampled
  (temperature 0.7) answers each, 128 new tokens, regex for model and company names.
  Descriptive only. Pre-registered in docs/preregistration/phase2a-section31-training.md §8.2.
hf:
  base:
    repo: meta-llama/Llama-3.1-8B
    revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  adapter:
    repo: chloeli/llama-3.1-8b-baseline
    revision: 42a80a90954a12e5f6dfab2f45e2e85ffb3744c1
args:
  base: hf:base
  adapter: hf:adapter
  n-samples: 8
  temperature: 0.7
  max-new-tokens: 128
  batch-size: 32
  dtype: bfloat16
  device: cuda
  seed: 0
