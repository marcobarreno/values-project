name: phase2a-baseline
command: train_lora
description: >
  Phase 2a arm A4 (baseline): a fresh LoRA r64/a128 on Llama-3.1-8B, one epoch of
  assistant-only loss on the Phase 2 instruction mix alone (no identity samples, authors'
  filtered no_robots), unpacked, seed 0. Pre-registered in
  docs/preregistration/phase2a-section31-training.md §3.
hf:
  base:
    repo: meta-llama/Llama-3.1-8B
    revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
files:
  it_mix: {path: msm/runs/phase2-it-mix-section3-clean, sha256: 82c5353f8cd549910f13cc27664a01984d2246377ffd564f749e43005f295753}
args:
  stage: chat
  base: hf:base
  data: [file:it_mix/it_mix.jsonl]
  chat-template-file: src/msm_repro/templates/llama31_msm.jinja
  loss-on: assistant
  no-packing: true
  max-seq-len: 4096
  epochs: 1
  lr: 1.0e-4
  warmup-ratio: 0.05
  weight-decay: 0.01
  per-device-batch-size: 4
  grad-accum: 4
  logging-steps: 10
  bf16: true
  gradient-checkpointing: true
  attn-implementation: kernels-community/flash-attn2@81fb77c12b2ad5d69380669b46739d5868614502
  seed: 0
